name: Build boot.firm (dead-eMMC workaround)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends git zip curl ca-certificates build-essential python3 python3-pip python3-setuptools
          dkp-pacman -Syu --noconfirm 3ds-dev
          pip3 install --break-system-packages git+https://github.com/TuxSH/firmtool.git || pip3 install git+https://github.com/TuxSH/firmtool.git
          git clone --depth 1 https://github.com/jakcron/Project_CTR.git /tmp/Project_CTR
          make -C /tmp/Project_CTR/makerom deps
          make -C /tmp/Project_CTR/makerom -j"$(nproc)"
          cp /tmp/Project_CTR/makerom/bin/makerom /usr/local/bin/makerom

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: boot.firm
          path: boot.firm
